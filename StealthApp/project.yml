name: LiveCopilot
options:
  bundleIdPrefix: com.livecopilot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    APP_DISPLAY_NAME: LiveCopilot
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_TESTABILITY: YES
    ENABLE_DEBUG_DYLIB: NO
targets:
  LiveCopilot:
    type: application
    platform: macOS
    dependencies:
      - framework: build/SparkleTools/Sparkle.framework
        embed: true
        codeSign: false
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/OpenAI-Logomark.svg
        buildPhase: resources
      - path: Resources/MetricIcons
        type: folder
        buildPhase: resources
      - path: Resources/ProviderLogos
        type: folder
        buildPhase: resources
      - path: Resources/LocalRuntime
        type: folder
        buildPhase: resources
      - path: Resources/LayaRuntime
        type: folder
        buildPhase: resources
      - path: Resources/AnalysisConfigurations.json
        buildPhase: resources
      - path: Resources/ThirdPartyNotices.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livecopilot.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/LiveCopilot.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.livecopilot.development
          APP_DISPLAY_NAME: LiveCopilot Dev
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  LiveCopilotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CoreChecks.swift
      - path: Tests/NativeTests.swift
      - path: Tests/ModelHealthTests.swift
      - path: Tests/HistoryTests.swift
      - path: Tests/LayaTriggerChecks.swift
      - path: Tests/LayaCoordinatorTests.swift
      - path: Tests/LayaWorkerTests.swift
      - path: Tests/IndexingProgressTests.swift
      - path: Tests/OnboardingTests.swift
      - path: Tests/AppUpdateTests.swift
      - path: Tests/PipelineBenchmarks.swift
      - path: Tests/HybridLanguageTests.swift
      - path: Tests/AnalysisSelectionTests.swift
      - path: Tests/RetrievalPreparationTests.swift
      - path: Tests/AnswerLatencyTests.swift
      - path: Tests/ConfiguredAnalysisChecks.swift
      # Copied into the test bundle at build time so the test host never reads the source tree,
      # which may sit in a TCC-protected folder such as ~/Documents.
      - path: ../docs/oss-model-manifest.json
        buildPhase: resources
      - path: ../docs/zipformer-model-manifest.json
        buildPhase: resources
    dependencies:
      - target: LiveCopilot
      - framework: build/SparkleTools/Sparkle.framework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: XCODE_TESTS
schemes:
  LiveCopilot:
    build:
      targets:
        LiveCopilot: all
        LiveCopilotTests: [test]
    test:
      environmentVariables:
        LIVECOPILOT_MOCK: "1"
        LIVECOPILOT_UI_ACCEPTANCE: "$(LIVECOPILOT_UI_ACCEPTANCE)"
        LIVECOPILOT_UPDATE_FIXTURE: "$(LIVECOPILOT_UPDATE_FIXTURE)"
        LIVECOPILOT_KEYCHAIN_INTERACTIVE: "$(LIVECOPILOT_KEYCHAIN_INTERACTIVE)"
        LIVECOPILOT_REAL_ANALYSIS: "$(LIVECOPILOT_REAL_ANALYSIS)"
        LIVECOPILOT_LATENCY_COMPARISON: "$(LIVECOPILOT_LATENCY_COMPARISON)"
        LIVECOPILOT_PIPELINE_BENCHMARK: "$(LIVECOPILOT_PIPELINE_BENCHMARK)"
        LIVECOPILOT_TEST_REAL_LAYA: "$(LIVECOPILOT_TEST_REAL_LAYA)"
        LIVECOPILOT_TEST_LAYA_ROOT: "$(LIVECOPILOT_TEST_LAYA_ROOT)"
        LIVECOPILOT_TEST_LAYA_RESOURCES: "$(LIVECOPILOT_TEST_LAYA_RESOURCES)"
      targets:
        - LiveCopilotTests
