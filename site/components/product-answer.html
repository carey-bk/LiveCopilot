<div class="product-answer" data-part="answer-region">
  <p class="product-question" data-part="question">$demo_question</p>
  <p class="product-loading" data-part="loading" hidden>
    <span aria-hidden="true">◌</span> $product_loading
  </p>
  <p class="product-empty" data-part="empty" hidden>$product_empty</p>
  <div data-part="response">
    <h4>$product_suggested</h4>
    <p class="product-answer-text" data-part="answer">$demo_reply</p>
    <div class="product-evidence" data-part="evidence">
      <h4>$product_evidence</h4>
      <p>$product_evidence_text</p>
    </div>
  </div>
  <div class="product-sources" data-part="sources">
    <h4>$product_sources</h4>
    <details>
      <summary data-part="source-label">$product_source1</summary>
      <p data-part="source-passage">$demo_passage</p>
    </details>
    <details>
      <summary>$product_source2</summary>
      <p>$product_source2_text</p>
    </details>
  </div>
</div>
