<div class="product-ui product-ui--$variant" data-product="$instance">
  <div class="product-header">
    <span class="product-brand"
      ><img
        src="${prefix}assets/logo.png"
        width="22"
        height="22"
        alt=""
      />LiveCopilot</span
    ><span class="product-tools"
      ><span class="product-tool stop" title="$product_stop" aria-hidden="true"
        ><svg
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="10" cy="10" r="8" fill="currentColor" stroke="none" />
          <rect
            x="7"
            y="7"
            width="6"
            height="6"
            rx="1"
            fill="white"
            stroke="none"
          /></svg></span
      ><span
        class="product-tool reset"
        title="$product_reset"
        aria-hidden="true"
        ><svg
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M16 7a6.5 6.5 0 1 0 .4 5M16 2v5h-5" /></svg></span
      ><span class="product-tool mic" title="$product_mic" aria-hidden="true"
        ><svg
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            x="7"
            y="2"
            width="6"
            height="10"
            rx="3"
            fill="currentColor"
            stroke="none"
          />
          <path d="M4.5 9a5.5 5.5 0 0 0 11 0M10 15v3M7 18h6" /></svg></span
      ><span
        class="product-tool settings"
        title="$product_settings"
        aria-hidden="true"
        ><svg
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="m8 2 4 0 .6 2.3 2 .9 2.1-.6 2 3.4-1.6 1.7v2.3l1.6 1.7-2 3.4-2.1-.6-2 .9L12 20H8l-.6-2.3-2-.9-2.1.6-2-3.4L3 12.3V10L1.3 8.3l2-3.4 2.1.6 2-.9Z"
            transform="translate(1 -1) scale(.9)"
          />
          <circle cx="10" cy="9" r="3" /></svg></span
      ><span class="product-tool pin" title="$product_pin" aria-hidden="true"
        ><svg
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M7 2h6l-1 6 3 3H5l3-3-1-6ZM10 11v7" /></svg></span
      ><span class="product-tool hide" title="$product_hide" aria-hidden="true"
        ><svg
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 10h10" /></svg></span
    ></span>
  </div>
  <p class="product-status">$product_status</p>
  <div class="product-state-row">
    <span data-part="phase">$product_phase</span
    ><span class="product-auto" aria-hidden="true">$product_auto <i></i></span>
  </div>
  $product_transcript_fragment
  <div class="product-actions" aria-hidden="true">
    <span
      ><svg
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M2 3h11v8H7l-3 3v-3H2ZM9 13h4l3 3v-3h2V6h-3" />
      </svg>
      $product_reply</span
    ><span
      ><svg
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="2" y="3" width="16" height="13" rx="2" />
        <path d="M5 7h1m2 0h7M5 12h1m2 0h7" />
      </svg>
      $product_recap</span
    ><span
      ><svg
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M2 3h16v11h-6l-4 3v-3H2Z" />
        <path d="M8 7a2 2 0 1 1 3 1.7L10 10m0 2h.01" />
      </svg>
      $product_followup</span
    >
  </div>
  $product_answer_fragment
  <div class="product-bottom">
    <div class="product-input-row">
      <label
        ><span class="sr-only">$demo_input_label</span
        ><input
          placeholder="$product_input"
          maxlength="180"
          autocomplete="off" /></label
      ><span class="product-ask" aria-hidden="true">$product_ask</span>
    </div>
    <span class="product-check" aria-hidden="true"
      ><i>✓</i> $product_context</span
    >
    <div class="product-footer">
      <span>$product_scenario</span
      ><button
        class="product-copy"
        type="button"
        data-label="$product_copy"
        data-copied="$product_copied"
      >
        $product_copy</button
      ><span>⌥H</span>
    </div>
  </div>
  <span class="product-resize" aria-hidden="true">⤢</span>
</div>
